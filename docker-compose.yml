version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-campaign_buddy}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./campaign-buddy-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-campaign_buddy}?schema=public
      PORT: 4000
      STAFF_JWT_SECRET: ${STAFF_JWT_SECRET:-change-me-staff-secret}
      STAFF_JWT_EXPIRES_IN: ${STAFF_JWT_EXPIRES_IN:-86400}
      STAFF_REFRESH_TOKEN_TTL_DAYS: ${STAFF_REFRESH_TOKEN_TTL_DAYS:-30}
      USER_JWT_SECRET: ${USER_JWT_SECRET:-change-me-user-secret}
      USER_JWT_EXPIRES_IN: ${USER_JWT_EXPIRES_IN:-8h}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-10}
      # License usage tracking (docs/license-usage-spec.md). Both optional.
      LICENSE_WARN_THRESHOLD_PCT: ${LICENSE_WARN_THRESHOLD_PCT:-80}
      LICENSE_SNAPSHOT_DISABLED: ${LICENSE_SNAPSHOT_DISABLED:-0}
      # Portal "Report an issue" -> GitHub Issues (docs/issue-reporting-spec.md).
      # All optional; reports persist regardless and sync only when ENABLED=1
      # with a token + repo set.
      GITHUB_ISSUES_ENABLED: ${GITHUB_ISSUES_ENABLED:-0}
      GITHUB_ISSUES_REPO: ${GITHUB_ISSUES_REPO:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_ISSUES_DEFAULT_LABELS: ${GITHUB_ISSUES_DEFAULT_LABELS:-portal,from-portal}
      ISSUE_SYNC_DISABLED: ${ISSUE_SYNC_DISABLED:-0}
      # The daily usage-snapshot job buckets periods in this timezone.
      TZ: ${TZ:-Asia/Colombo}
    depends_on:
      postgres:
        condition: service_healthy

  portal:
    build:
      context: ./campaign-buddy-portal
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
      # nginx proxies /training/ to the marketing container (see nginx.conf).
      - marketing

  # Static marketing content, served from ./marketing:
  #   /landing-site/  -> marketing/landing-site/index.html
  #   /training/      -> marketing/training/index.html
  # Point Cloudflare tunnel hostnames/paths at `http://marketing:80`.
  marketing:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./marketing:/usr/share/nginx/html:ro
      - ./deploy/marketing-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # ports:
    #   - "8083:80"   # uncomment for local access at http://localhost:8083

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # Remotely-managed tunnel: ingress lives in the Cloudflare dashboard
    # (Zero Trust > Networks > Tunnels > Public Hostname), pointing at the
    # same service URLs as deploy/cloudflared/config.yml.
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARED_TUNNEL_TOKEN}
    # Locally-managed tunnel (uses deploy/cloudflared/config.yml instead):
    # replace TUNNEL_ID in that file, then comment out `command: tunnel run`
    # + `environment` above and uncomment the three lines below.
    # command: tunnel --config /etc/cloudflared/config.yml run
    # volumes:
    #   - ./deploy/cloudflared/config.yml:/etc/cloudflared/config.yml:ro
    #   - ~/.cloudflared:/etc/cloudflared:ro
    depends_on:
      - portal
      - backend
      - marketing
    profiles:
      - production

volumes:
  postgres_data:
