<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Campaign Buddy — Portal</title>
<style>
:root {
  --ink:#12241F; --ink-soft:#23413A; --surface:#F4F6F3; --surface-card:#FFFFFF;
  --line:#E3E7E1; --text-primary:#16211C; --text-muted:#647169; --text-inverse:#F4F6F3;
  --mango:#FF7A33; --mango-dark:#E8641F; --mango-tint:#FFE6D6;
  --success:#1F9D55; --success-tint:#E4F5EA; --pending:#C77F00; --pending-tint:#FBF0DA;
  --alert:#D8483F; --alert-tint:#FBE6E4; --info:#2673B0; --info-tint:#E3F0FA;
  --sidebar-w:250px; --topbar-h:64px;
}
* { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; font-family:'Liberation Sans',Arial,sans-serif; color:var(--text-primary); background:var(--surface); }
.h-display { font-family:'Poppins','Liberation Sans',sans-serif; font-weight:600; }
button, select, input { font-family:inherit; }
a { color:inherit; text-decoration:none; }

/* ===== shell ===== */
#app { display:flex; min-height:100vh; }
.sidebar {
  width:var(--sidebar-w); flex-shrink:0; background:var(--ink); color:var(--text-inverse);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.sidebar::-webkit-scrollbar { width:6px; } .sidebar::-webkit-scrollbar-thumb { background:#2B4A41; border-radius:4px; }
.brand-row { display:flex; align-items:center; gap:10px; padding:18px 20px; border-bottom:1px solid rgba(255,255,255,0.08); }
.brand-mark { width:32px; height:32px; border-radius:9px; background:var(--mango); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.brand-name { font-size:15px; }
.brand-role-pill { font-size:10px; font-weight:700; color:#9FB2AA; letter-spacing:0.3px; margin-top:1px; }
.nav-scroll { flex:1; padding:10px 10px 20px; }
.nav-section-label { font-size:10.5px; font-weight:700; color:#7C948A; letter-spacing:0.4px; padding:14px 10px 6px; }
.nav-item { display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:9px; font-size:13px; font-weight:600; color:#C6D4CC; cursor:pointer; }
.nav-item svg { width:16px; height:16px; flex-shrink:0; opacity:0.85; }
.nav-item:hover { background:rgba(255,255,255,0.06); color:#fff; }
.nav-item.active { background:var(--mango); color:#fff; }
.nav-item.active svg { opacity:1; }
.nav-children { padding-left:16px; margin-top:2px; }
.nav-child { display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:8px; font-size:12.5px; font-weight:600; color:#A9BDB4; cursor:pointer; }
.nav-child:hover { background:rgba(255,255,255,0.06); color:#fff; }
.nav-child.active { background:rgba(255,122,51,0.18); color:#FFB98C; }
.nav-child .dot { width:4px; height:4px; border-radius:50%; background:currentColor; flex-shrink:0; }

.main { flex:1; min-width:0; display:flex; flex-direction:column; }
.topbar {
  height:var(--topbar-h); background:var(--surface-card); border-bottom:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between; padding:0 26px; position:sticky; top:0; z-index:20; gap:20px;
}
.topbar .crumb { font-size:12.5px; color:var(--text-muted); }
.topbar .page-title-mini { font-size:15px; font-weight:700; }
.topbar-right { display:flex; align-items:center; gap:12px; }
.switcher { display:flex; align-items:center; gap:7px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:7px 12px; font-size:12.5px; font-weight:600; cursor:pointer; }
.switcher select { border:none; background:transparent; font-size:12.5px; font-weight:600; color:var(--text-primary); cursor:pointer; outline:none; }
.role-badge { font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:20px; text-transform:uppercase; letter-spacing:0.3px; }
.role-badge.admin { background:var(--mango-tint); color:var(--mango-dark); }
.role-badge.supervisor { background:var(--info-tint); color:var(--info); }
.role-badge.sponsor { background:var(--success-tint); color:var(--success); }
.topbar-avatar { width:34px; height:34px; border-radius:50%; background:var(--mango-tint); color:var(--mango-dark); display:flex; align-items:center; justify-content:center; font-family:'Poppins',sans-serif; font-weight:600; font-size:13px; flex-shrink:0; }

.content { flex:1; padding:26px 30px 60px; max-width:1400px; width:100%; }

/* ===== page head ===== */
.page-head { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:18px; gap:16px; flex-wrap:wrap; }
.page-head h1 { font-family:'Poppins',sans-serif; font-weight:600; font-size:21px; }
.page-sub { font-size:12.5px; color:var(--text-muted); margin-top:3px; }
.btn { display:inline-flex; align-items:center; gap:7px; border:none; border-radius:10px; font-family:'Poppins',sans-serif; font-weight:600; font-size:13px; cursor:pointer; padding:10px 16px; white-space:nowrap; }
.btn-primary { background:var(--mango); color:#fff; }
.btn-primary:hover { background:var(--mango-dark); }
.btn-secondary { background:var(--surface-card); color:var(--ink); border:1.5px solid var(--line); }
.btn-secondary:hover { border-color:#C7D0C9; }
.btn-ghost-alert { background:var(--alert-tint); color:var(--alert); }
.btn-sm { padding:7px 12px; font-size:12px; }
.locked-note { display:flex; align-items:center; gap:7px; font-size:12px; color:var(--text-muted); background:var(--surface); border:1px dashed var(--line); border-radius:10px; padding:8px 13px; }

/* ===== filter bar ===== */
.filter-bar { background:var(--surface-card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; display:flex; align-items:flex-end; gap:14px; flex-wrap:wrap; margin-bottom:16px; }
.filter-field { display:flex; flex-direction:column; gap:5px; min-width:150px; }
.filter-field label { font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.3px; }
.filter-field select, .filter-field input { border:1.5px solid var(--line); border-radius:9px; padding:8px 10px; font-size:12.5px; background:var(--surface); }

/* ===== table card ===== */
.table-card { background:var(--surface-card); border:1px solid var(--line); border-radius:16px; overflow:hidden; }
.table-toolbar { display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid var(--line); gap:14px; flex-wrap:wrap; }
.entries-select { font-size:12.5px; color:var(--text-muted); display:flex; align-items:center; gap:6px; }
.entries-select select { border:1px solid var(--line); border-radius:7px; padding:4px 7px; font-size:12.5px; }
.toolbar-right { display:flex; align-items:center; gap:10px; }
.search-box { display:flex; align-items:center; gap:7px; border:1.5px solid var(--line); border-radius:9px; padding:7px 11px; background:var(--surface); }
.search-box input { border:none; background:transparent; font-size:12.5px; outline:none; width:150px; }
.btn-excel { display:flex; align-items:center; gap:6px; background:var(--success-tint); color:var(--success); font-size:12px; font-weight:700; padding:7px 12px; border-radius:9px; cursor:pointer; }
.table-scroll { overflow-x:auto; }
table.data-table { width:100%; border-collapse:collapse; font-size:12.5px; }
table.data-table th { text-align:left; font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.3px; padding:11px 18px; background:var(--surface); border-bottom:1px solid var(--line); white-space:nowrap; }
table.data-table td { padding:12px 18px; border-bottom:1px solid var(--line); vertical-align:middle; white-space:nowrap; }
table.data-table tbody tr:last-child td { border-bottom:none; }
table.data-table tbody tr:hover { background:#FBFCFA; }
.cell-strong { font-weight:600; }
.cell-muted { color:var(--text-muted); }
.avatar-mini { width:28px; height:28px; border-radius:8px; background:var(--mango-tint); color:var(--mango-dark); display:inline-flex; align-items:center; justify-content:center; font-weight:600; font-size:11px; margin-right:8px; vertical-align:middle; }
.badge { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px; }
.badge.success { background:var(--success-tint); color:var(--success); }
.badge.pending { background:var(--pending-tint); color:var(--pending); }
.badge.alert { background:var(--alert-tint); color:var(--alert); }
.badge.info { background:var(--info-tint); color:var(--info); }
.badge.muted { background:var(--surface); color:var(--text-muted); border:1px solid var(--line); }
.row-actions { display:flex; align-items:center; gap:8px; }
.icon-btn { width:29px; height:29px; border-radius:8px; border:1px solid var(--line); background:var(--surface-card); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
.icon-btn:hover { border-color:#C7D0C9; }
.icon-btn.view { color:var(--info); } .icon-btn.edit { color:var(--success); } .icon-btn.delete { color:var(--alert); } .icon-btn.target { color:var(--text-muted); }
.table-footer { display:flex; align-items:center; justify-content:space-between; padding:14px 18px; font-size:12px; color:var(--text-muted); flex-wrap:wrap; gap:10px; }
.pager { display:flex; gap:6px; }
.pager span { padding:6px 11px; border-radius:8px; border:1px solid var(--line); cursor:pointer; }
.pager span.active { background:var(--ink); color:#fff; border-color:var(--ink); }
.empty-state { padding:56px 20px; text-align:center; color:var(--text-muted); font-size:13px; }
.empty-state .big { font-size:14px; font-weight:600; color:var(--text-primary); margin-bottom:6px; }

/* ===== dashboard ===== */
.stat-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:18px; }
.stat-card { background:var(--surface-card); border:1px solid var(--line); border-radius:16px; padding:18px 20px; }
.stat-card .l { font-size:11.5px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.3px; }
.stat-card .n { font-family:'Poppins',sans-serif; font-weight:600; font-size:25px; margin-top:8px; }
.stat-card .delta { font-size:11.5px; margin-top:6px; font-weight:600; }
.stat-card .delta.up { color:var(--success); } .stat-card .delta.down { color:var(--alert); }
.dash-grid { display:grid; grid-template-columns:1.4fr 1fr; gap:16px; }
.panel { background:var(--surface-card); border:1px solid var(--line); border-radius:16px; padding:18px 20px; }
.panel-title { font-size:13.5px; font-weight:700; } .panel-sub { font-size:11.5px; color:var(--text-muted); margin-top:2px; }
.bars-row { display:flex; align-items:flex-end; gap:14px; height:150px; margin-top:20px; padding:0 4px; }
.bar-col { flex:1; display:flex; flex-direction:column; align-items:center; gap:7px; }
.bar-col .bar { width:100%; border-radius:6px 6px 0 0; background:var(--mango); }
.bar-col .bar.today { background:var(--ink); }
.bar-col .day { font-size:10.5px; color:var(--text-muted); font-weight:600; }
.feed-item { display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
.feed-item:last-child { border-bottom:none; }
.feed-dot { width:8px; height:8px; border-radius:50%; margin-top:5px; flex-shrink:0; }
.feed-text { font-size:12.5px; } .feed-time { font-size:11px; color:var(--text-muted); margin-top:2px; }
.rank-row { display:flex; align-items:center; gap:11px; padding:10px 0; border-bottom:1px solid var(--line); }
.rank-row:last-child { border-bottom:none; }
.rank-num { width:22px; height:22px; border-radius:50%; background:var(--surface); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-family:'Poppins',sans-serif; font-weight:600; font-size:10.5px; color:var(--text-muted); flex-shrink:0; }
.rank-name { font-size:12.5px; font-weight:600; } .rank-meta { font-size:11px; color:var(--text-muted); }
.rank-val { margin-left:auto; font-family:'Poppins',sans-serif; font-weight:600; font-size:13px; }

/* ===== sponsor map ===== */
.map-shell { border-radius:16px; overflow:hidden; border:1px solid var(--line); position:relative; height:340px; background:
  linear-gradient(135deg,#EAF2ED 25%,#E3ECE5 25%,#E3ECE5 50%,#EAF2ED 50%,#EAF2ED 75%,#E3ECE5 75%,#E3ECE5 100%);
  background-size:34px 34px;
}
.map-road { position:absolute; background:#D8E0D9; }
.map-pin { position:absolute; display:flex; flex-direction:column; align-items:center; transform:translate(-50%,-100%); cursor:pointer; }
.map-pin .dot { width:14px; height:14px; border-radius:50%; background:var(--mango); border:3px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,0.25); }
.map-pin .pulse { position:absolute; top:-3px; width:20px; height:20px; border-radius:50%; background:rgba(255,122,51,0.35); animation:pulse 1.8s infinite; }
@keyframes pulse { 0%{transform:scale(0.6);opacity:0.9;} 100%{transform:scale(2.1);opacity:0;} }
.map-pin .tag { margin-top:6px; background:var(--ink); color:#fff; font-size:10.5px; font-weight:600; padding:4px 8px; border-radius:7px; white-space:nowrap; }
.map-pin.outlet .dot { background:var(--ink); }
.map-legend { position:absolute; left:14px; bottom:14px; background:rgba(255,255,255,0.92); border-radius:10px; padding:9px 12px; font-size:11px; display:flex; gap:14px; }
.map-legend .item { display:flex; align-items:center; gap:6px; }
.map-legend .sw { width:9px; height:9px; border-radius:50%; }

/* ===== drawer ===== */
.overlay { position:fixed; inset:0; background:rgba(10,18,15,0.45); z-index:80; display:none; }
.overlay.open { display:block; }
.drawer { position:fixed; top:0; right:0; height:100vh; width:460px; max-width:92vw; background:var(--surface-card); z-index:90; box-shadow:-8px 0 30px rgba(0,0,0,0.18); transform:translateX(100%); transition:transform .25s ease; display:flex; flex-direction:column; }
.drawer.open { transform:translateX(0); }
.drawer-head { padding:20px 22px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; }
.drawer-title { font-size:16px; } .drawer-sub { font-size:11.5px; color:var(--text-muted); margin-top:2px; }
.close-btn { width:30px; height:30px; border-radius:50%; background:var(--surface); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
.drawer-body { flex:1; overflow-y:auto; padding:20px 22px; }
.drawer-foot { padding:16px 22px; border-top:1px solid var(--line); display:flex; gap:10px; }
.drawer-foot .btn { flex:1; justify-content:center; }
.form-row { margin-bottom:16px; }
.form-row label { font-size:12px; font-weight:700; color:var(--text-muted); display:flex; align-items:center; gap:4px; margin-bottom:6px; }
.form-row .req { color:var(--alert); }
.form-row input, .form-row select, .form-row textarea { width:100%; border:1.5px solid var(--line); border-radius:10px; padding:10px 12px; font-size:13px; background:var(--surface); }
.form-row textarea { min-height:70px; resize:vertical; }
.form-two { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.radio-row, .chip-row { display:flex; gap:8px; flex-wrap:wrap; }
.chip-opt { font-size:12px; font-weight:600; padding:8px 13px; border-radius:20px; border:1.5px solid var(--line); color:var(--text-muted); background:var(--surface); cursor:pointer; }
.chip-opt.selected { background:var(--ink); color:#fff; border-color:var(--ink); }
.builder-add-row { display:flex; gap:8px; align-items:flex-end; margin-bottom:12px; }
.builder-add-row select { flex:1; }
.builder-table { border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-bottom:6px; }
.builder-table div.brow { display:flex; align-items:center; justify-content:space-between; padding:9px 12px; font-size:12.5px; border-bottom:1px solid var(--line); }
.builder-table div.brow:last-child { border-bottom:none; }
.section-divider { font-size:12px; font-weight:700; color:var(--ink); margin:20px 0 12px; padding-top:14px; border-top:1px solid var(--line); }
.section-divider:first-child { margin-top:0; padding-top:0; border-top:none; }
.hint-note { font-size:11px; color:var(--text-muted); margin-top:5px; }

/* ===== calendar (assign routes) ===== */
.cal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.cal-nav { display:flex; align-items:center; gap:10px; }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
.cal-dow { background:var(--surface); text-align:center; font-size:11px; font-weight:700; color:var(--text-muted); padding:8px 0; }
.cal-cell { background:var(--surface-card); min-height:84px; padding:7px; font-size:11.5px; }
.cal-cell .dnum { font-weight:600; font-size:12px; }
.cal-cell.faded { color:#C6CFC9; background:#FAFBF9; }
.cal-chip { margin-top:5px; background:var(--info-tint); color:var(--info); font-size:10px; font-weight:700; padding:3px 6px; border-radius:6px; display:block; }
.cal-chip.mango { background:var(--mango-tint); color:var(--mango-dark); }

/* ===== toast ===== */
.toast { position:fixed; left:50%; bottom:30px; transform:translate(-50%,10px); background:var(--ink); color:#fff; font-size:12.5px; font-weight:600; padding:12px 20px; border-radius:24px; z-index:100; opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease; }
.toast.show { opacity:1; transform:translate(-50%,0); }

/* ===== breadcrumb pill for activation targets ===== */
.crumb-pill { display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-muted); background:var(--surface-card); border:1px solid var(--line); border-radius:10px; padding:9px 14px; margin-bottom:16px; }
.crumb-pill b { color:var(--text-primary); }

@media (max-width: 980px) {
  .stat-grid { grid-template-columns:repeat(2,1fr); }
  .dash-grid { grid-template-columns:1fr; }
}
</style>
</head>
<body>

<div id="app">
  <div class="sidebar">
    <div class="brand-row">
      <div class="brand-mark"><svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M4 17L9 12L13 16L20 8" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 8H20V14" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div>
        <div class="brand-name h-display">Campaign Buddy</div>
        <div class="brand-role-pill" id="sidebarRoleLabel">SUPER ADMIN</div>
      </div>
    </div>
    <div class="nav-scroll" id="navScroll"></div>
  </div>

  <div class="main">
    <div class="topbar">
      <div>
        <div class="crumb" id="crumbText">Dashboard</div>
        <div class="page-title-mini" id="pageTitleMini">Overview</div>
      </div>
      <div class="topbar-right">
        <div class="switcher"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M3 12l4-2 4 5 6-10 4 3" stroke="#647169" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <select id="campaignSwitcher" onchange="onCampaignChange()"></select>
        </div>
        <div class="switcher"><span id="roleBadgeWrap"></span>
          <select id="roleSwitcher" onchange="onRoleChange()">
            <option value="admin">Admin view</option>
            <option value="supervisor">Supervisor view</option>
            <option value="sponsor">Sponsor view</option>
          </select>
        </div>
        <div class="topbar-avatar" id="topAvatar">DY</div>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <div><div class="drawer-title h-display" id="drawerTitle">Add New</div><div class="drawer-sub" id="drawerSub"></div></div>
    <div class="close-btn" onclick="closeDrawer()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="#647169" stroke-width="2" stroke-linecap="round"/></svg></div>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-foot">
    <button class="btn btn-secondary" onclick="closeDrawer()">Cancel</button>
    <button class="btn btn-primary" id="drawerSaveBtn" onclick="saveDrawer()">Save</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   ICONS
============================================================ */
const ICO = {
  dashboard:'<svg viewBox="0 0 24 24" fill="none"><path d="M4 11l8-7 8 7v9a1 1 0 01-1 1h-4v-6H9v6H5a1 1 0 01-1-1z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>',
  clients:'<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="7" width="18" height="13" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2" stroke="currentColor" stroke-width="1.8"/></svg>',

function avatar(initials, name, sub){ return `<span class="avatar-mini">${initials}</span><span class="cell-strong">${name}</span>${sub?`<div class="cell-muted" style="margin-left:36px;margin-top:2px;">${sub}</div>`:''}`; }
function badge(type,label){ return `<span class="badge ${type}">${label}</span>`; }
function actionsCell(icons){
  const map = { view:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z" stroke="currentColor" stroke-width="1.8"/></svg>',
                edit:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 20l1-4L16.5 4.5a2 2 0 012.8 0l.2.2a2 2 0 010 2.8L8 19l-4 1z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>',
                delete:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M5 7h14M9 7V5a2 2 0 012-2h2a2 2 0 012 2v2m-9 0l1 12a2 2 0 002 2h4a2 2 0 002-2l1-12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
                target:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/></svg>' };
  const isReadOnly = ROLE!=='admin';
  const shown = isReadOnly ? icons.filter(i=>i==='view'||i==='target') : icons;
  return `<div class="row-actions">${shown.map(i=>`<div class="icon-btn ${i}" onclick="toast('${i==='delete'?'Delete requires confirmation':'Opening '+i}')">${map[i]}</div>`).join('')}</div>`;
}

/* ============================================================

============================================================ */
function renderAssignRoutes(){
  const dow = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let cells = '';
  dow.forEach(d=>cells+=`<div class="cal-dow">${d}</div>`);
  // Sept 2026 starts on a Tuesday; 30 days. Build 5 leading blanks then days.
  const lead = 2;
  for(let i=0;i<lead;i++) cells+=`<div class="cal-cell faded"></div>`;
  for(let d=1; d<=30; d++){
    let chip = '';
    if([1,2,3,4,5,8,9,10,11,12].includes(d)) chip = `<span class="cal-chip">Nawala Outlet</span>`;
    if([1,3,5,8,10,12].includes(d)) chip += `<span class="cal-chip mango">Rajagiriya Outlet</span>`;
    cells += `<div class="cal-cell ${d===5?'':''}"><div class="dnum">${d}</div>${chip}</div>`;
  }
  return `<div class="page-head"><div><h1>Assign Routes</h1><p class="page-sub">Plan which outlets a supervisor visits, by date — scoped to ${CAMPAIGN}.</p></div>
    <button class="btn btn-primary" onclick="openForm('supervisorRoutes')">+ Assign Routes</button></div>
  <div class="filter-bar">
    <div class="filter-field"><label>Supervisor</label><select><option>All supervisors</option><option>Neel Dharmapriya</option><option>Ishara Fernando</option></select></div>
    <div class="filter-field"><label>Outlet</label><select><option>All outlets</option><option>Nawala Retail Outlet</option><option>Keells Rajagiriya</option></select></div>

    <div class="cal-head"><div class="panel-title">September 2026</div><div class="cal-nav"><span class="icon-btn">‹</span><span class="icon-btn">›</span></div></div>
    <div class="cal-grid">${cells}</div>

  <div class="table-card">
    <div class="table-toolbar"><div class="entries-select">Planned routes this campaign</div></div>

/* ============================================================
   GENERIC TABLE PAGE RENDERER
============================================================ */
function renderTablePage(mod){
  const readOnly = ROLE !== 'admin';
  const head = `<div class="page-head"><div><h1>${mod.title}</h1><p class="page-sub">${mod.subtitle||''}</p></div>
    ${(!mod.noAdd && !readOnly) ? `<button class="btn btn-primary" onclick="openForm('${currentModuleId}')">+ ${mod.addLabel||'Add New'}</button>`
      : (!mod.noAdd && readOnly) ? `<div class="locked-note">🔒 Read-only in ${ROLE} view</div>` : ''}</div>`;

  let filters = '';
  if(mod.filters){
    filters = `<div class="filter-bar">${mod.filters.map(f=>{
      if(f.type==='select') return `<div class="filter-field"><label>${f.label}</label><select>${f.options.map(o=>`<option>${o}</option>`).join('')}</select></div>`;
      if(f.type==='date') return `<div class="filter-field"><label>${f.label}</label><input type="text" value="5 Sep 2026"></div>`;
      if(f.type==='daterange') return `<div class="filter-field"><label>${f.label}</label><input type="text" value="1 – 5 Sep 2026"></div>`;
      return '';
    }).join('')}<button class="btn btn-primary btn-sm" onclick="toast('Filters applied')">Load</button></div>`;
  }

  let tableInner;
  if(!mod.rows || mod.rows.length===0){
    tableInner = `<div class="empty-state"><div class="big">Nothing to show yet</div>${mod.emptyText||'No data available in table.'}</div>`;
  } else {
    tableInner = `<div class="table-scroll"><table class="data-table">
      <thead><tr>${mod.columns.map(c=>`<th>${c}</th>`).join('')}${mod.actions?'<th>Action</th>':''}</tr></thead>
      <tbody>${mod.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}${mod.actions?`<td>${actionsCell(mod.actions)}</td>`:''}</tr>`).join('')}</tbody>
    </table></div>
    ${mod.footerTotal? `<div class="table-footer"><b>Grand total: ${mod.footerTotal}</b><span></span></div>`:''}`;
  }

  const toolbar = mod.rows && mod.rows.length>0 ? `<div class="table-toolbar">
      <div class="entries-select">Show <select><option>10</option><option selected>25</option><option>50</option></select> entries</div>
      <div class="toolbar-right">
        ${mod.excel? `<div class="btn-excel" onclick="toast('Exporting Excel…')">⬇ Excel</div>`:''}
        <div class="search-box">🔍<input placeholder="Search..."></div>
      </div>
    </div>` : '';

  const footer = mod.rows && mod.rows.length>0 ? `<div class="table-footer">
      <span>Showing 1 to ${mod.rows.length} of ${mod.rows.length} entries</span>
      <div class="pager"><span>Previous</span><span class="active">1</span><span>Next</span></div>
    </div>` : '';

  return head + filters + `<div class="table-card">${toolbar}${tableInner}${footer}</div>`;
}

/* ============================================================
   ROUTER
============================================================ */
function render(){
  const el = document.getElementById('content');
  let html;
  if(currentModuleId==='dashboard'){
    html = ROLE==='sponsor' ? renderSponsorDashboard() : renderDashboardPage();
  } else if(currentModuleId==='liveMap'){
    html = renderLiveMapPage();
  } else if(currentModuleId==='staffProfiles'){
    html = renderProfiles();
  } else if(currentModuleId==='updateSales'){
    html = renderUpdateSales();
  } else if(currentModuleId==='assignRoutes'){
    html = renderAssignRoutes();
  } else if(currentModuleId==='monthlyAttendance'){
    html = renderMonthlyAttendance();
  } else if(MODULES[currentModuleId]){
    html = renderTablePage(MODULES[currentModuleId]);
  } else {
    html = `<div class="empty-state"><div class="big">Coming soon</div>This screen is not yet wired up in the prototype.</div>`;
  }
  el.innerHTML = html;

  // topbar text
  let label = findNavLabel(currentModuleId);
  document.getElementById('pageTitleMini').textContent = label.title;
  document.getElementById('crumbText').textContent = label.crumb;
}
function findNavLabel(id){
  for(const sec of NAV){
    for(const item of sec.items){
      if(item.id===id) return {title:item.label, crumb:(sec.section||'Home')};
      if(item.children){
        for(const c of item.children){ if(c.id===id) return {title:c.label, crumb:item.label}; }
      }
    }
  }
  const mod = MODULES[id];
  return {title: mod?mod.title:'Page', crumb: sec_fallback(id)};
}
function sec_fallback(){ return 'Campaign Buddy'; }

/* ============================================================
   NAV RENDER
============================================================ */
function navVisible(rolesArr){ return rolesArr.includes(ROLE); }
function renderNav(){
  const wrap = document.getElementById('navScroll');
  let html = '';
  NAV.forEach(sec=>{
    if(sec.roles && !navVisible(sec.roles)) return;
    const visibleItems = sec.items.filter(it=>navVisible(it.roles));
    if(visibleItems.length===0) return;
    if(sec.section) html += `<div class="nav-section-label">${sec.section}</div>`;
    visibleItems.forEach(it=>{
      if(it.children){
        const activeParent = it.children.some(c=>c.id===currentModuleId);
        html += `<div class="nav-item ${activeParent?'active':''}" onclick="toggleParent(this)">${ICO[it.icon]||''}<span>${it.label}</span></div>
          <div class="nav-children" style="display:${activeParent?'block':'none'}">${it.children.map(c=>`<div class="nav-child ${c.id===currentModuleId?'active':''}" onclick="event.stopPropagation(); goTo('${c.id}')"><span class="dot"></span>${c.label}</div>`).join('')}</div>`;
      } else {
        html += `<div class="nav-item ${it.id===currentModuleId?'active':''}" onclick="goTo('${it.id}')">${ICO[it.icon]||''}<span>${it.label}</span></div>`;
      }
    });
  });
  wrap.innerHTML = html;
  document.getElementById('sidebarRoleLabel').textContent = ROLE==='admin'?'SUPER ADMIN':(ROLE==='supervisor'?'SUPERVISOR':'SPONSOR');
  document.getElementById('topAvatar').textContent = ROLE==='admin'?'DY':(ROLE==='supervisor'?'ND':'PN');
}
function toggleParent(el){
  const next = el.nextElementSibling;
  const isOpen = next.style.display==='block';
  document.querySelectorAll('.nav-children').forEach(n=>n.style.display='none');
  next.style.display = isOpen? 'none':'block';
}
function goTo(id){
  currentModuleId = id;
  renderNav();
  render();
  window.scrollTo(0,0);
}

/* ============================================================
   ROLE / CAMPAIGN SWITCH
============================================================ */
function onRoleChange(){
  ROLE = document.getElementById('roleSwitcher').value;
  currentModuleId = 'dashboard';
  renderNav();
  render();
  toast('Switched to ' + ROLE + ' view');
}
function onCampaignChange(){
  CAMPAIGN = document.getElementById('campaignSwitcher').value;
  render();
  toast('Campaign switched to ' + CAMPAIGN);
}
function initSwitchers(){
  document.getElementById('campaignSwitcher').innerHTML = CAMPAIGNS.map(c=>`<option ${c===CAMPAIGN?'selected':''}>${c}</option>`).join('');
  document.getElementById('roleSwitcher').value = ROLE;
}

/* ============================================================
   DRAWER (Add / Edit forms)
============================================================ */
let selectedChips = {};
function openForm(modId, mode){
  const mod = MODULES[modId];
  if(!mod || !mod.formFields){ toast('Opening ' + (mod?mod.title:'form') + '…'); return; }
  document.getElementById('drawerTitle').textContent = (mode==='edit'?'Edit ':(mod.addFull?'Add New Member':mod.addLabel||'Add New'));
  document.getElementById('drawerSub').textContent = mod.title;
  document.getElementById('drawerSaveBtn').textContent = mod.saveLabel || 'Save';
  const body = document.getElementById('drawerBody');
  body.innerHTML = mod.formFields.map((f,idx)=>renderField(f, modId, idx)).join('')
    + (mod.postAddHint ? `<div class="hint-note" style="margin-top:6px;">${mod.postAddHint}</div>` : '');
  document.getElementById('drawer').classList.add('open');
  document.getElementById('overlay').classList.add('open');
}
function renderField(f, modId, idx){
  const reqMark = f.required? '<span class="req">*</span>' : '';
  if(f.type==='text') return `<div class="form-row"><label>${f.label} ${reqMark}</label><input type="text" placeholder="${f.placeholder||''}"></div>`;
  if(f.type==='textarea') return `<div class="form-row"><label>${f.label} ${reqMark}</label><textarea placeholder="${f.placeholder||''}"></textarea></div>`;
  if(f.type==='select') return `<div class="form-row"><label>${f.label} ${reqMark}</label><select>${f.options.map(o=>`<option>${o}</option>`).join('')}</select></div>`;
  if(f.type==='radio') return `<div class="form-row"><label>${f.label}</label><div class="radio-row">${f.options.map((o,i)=>`<span class="chip-opt ${i===0?'selected':''}" onclick="selectChip(this)">${o}</span>`).join('')}</div></div>`;
  if(f.type==='upload') return `<div class="form-row"><label>${f.label} ${reqMark}</label><div class="btn btn-secondary btn-sm" style="width:100%;justify-content:center;">📷 Choose file…</div></div>`;
  if(f.type==='daterange') return `<div class="form-row"><label>${f.label} ${reqMark}</label><div class="form-two"><input type="text" placeholder="From"><input type="text" placeholder="To"></div></div>`;
  if(f.type==='geocode') return `<div class="form-row"><div class="btn btn-secondary btn-sm" style="width:100%;justify-content:center;margin-bottom:12px;" onclick="toast('Coordinates fetched')">📍 Get Latitude and Longitude values</div><div class="form-two"><div><label>Latitude <span class="req">*</span></label><input type="text" placeholder="6.8845"></div><div><label>Longitude <span class="req">*</span></label><input type="text" placeholder="79.8887"></div></div></div>`;
  if(f.type==='builder') return `<div class="form-row"><label>${f.label}</label>
      <div class="builder-add-row">${f.optionsA?`<select>${f.optionsA.map(o=>`<option>${o}</option>`).join('')}</select>`:''}<select>${(f.optionsB||[]).map(o=>`<option>${o}</option>`).join('')}</select><button class="btn btn-secondary btn-sm" onclick="toast('Item added')">${f.addLabel||'Add'}</button></div>
      <div class="builder-table" id="builder-${idx}">${(f.preset||[]).map(p=>`<div class="brow"><span>${p}</span><span class="icon-btn delete" style="width:24px;height:24px;" onclick="this.parentElement.remove()">✕</span></div>`).join('')}</div>
    </div>`;
  return '';
}
function selectChip(el){
  const parent = el.parentElement;
  Array.prototype.forEach.call(parent.children, c=>c.classList.remove('selected'));
  el.classList.add('selected');
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}
function saveDrawer(){
  closeDrawer();
  toast('Saved');
}

/* ============================================================
   TOAST
============================================================ */
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1700);
}

/* ============================================================
   INIT
============================================================ */
initSwitchers();
renderNav();
render();
</script>
