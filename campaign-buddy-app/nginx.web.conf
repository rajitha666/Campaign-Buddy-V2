# CB Mobile static web export. Single-page app: unknown paths fall back to
# index.html. Cache hashed assets hard, index lightly.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite/Metro-hashed bundles change name per build, so cache them long.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.html$ {
        expires -1;
    }
}
