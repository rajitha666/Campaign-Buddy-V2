server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Docker Compose's embedded DNS (127.0.0.11) — used with a variable below so
    # nginx re-resolves `backend`/`marketing` on a short TTL instead of caching
    # the IP once at startup. Without this, restarting/rebuilding just the
    # backend container (a routine deploy step) leaves portal proxying to a
    # dead IP until portal itself is also restarted — the "disconnect" bug.
    resolver 127.0.0.11 valid=10s;
    set $backend_upstream http://backend:4000;
    set $marketing_upstream http://marketing:80;

    # Multipart photo uploads (staff photos, item images) are capped at 5MB
    # server-side by multer; nginx's default 1m body limit would 413 them
    # before they reach the backend in prod.
    client_max_body_size 6m;

    # Gotcha: with a variable in proxy_pass, an appended URI is passed as-is,
    # replacing the original request URI — so `$backend_upstream/admin/v1/`
    # turned every /admin/v1/auth/login into bare /admin/v1/. Use the variable
    # alone; backend and portal paths mirror 1:1.
    location /admin/v1/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass $backend_upstream;
    }

    # Item images: served by the backend as /uploads/items/<file>. Mirrors the
    # vite dev proxy in vite.config.js so prod resolves like dev.
    location /uploads/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Role training guides. Served same-origin so the portal's "Training guide"
    # menu item can use a relative /training/<role>.html link. The content lives
    # in the marketing container (marketing/training/); locally `npm run build`
    # copies it into dist/training/ instead (scripts/sync-training.mjs).
    location /training/ {
        proxy_pass $marketing_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
