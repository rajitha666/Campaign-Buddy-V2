server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Docker Compose's embedded DNS (127.0.0.11) — used with a variable below so
    # nginx re-resolves `backend`/`marketing` on a short TTL instead of caching
    # the IP once at startup. Without this, restarting/rebuilding just the
    # backend container (a routine deploy step) leaves portal proxying to a
    # dead IP until portal itself is also restarted — the "disconnect" bug.
    resolver 127.0.0.11 valid=10s;
    set $backend_upstream http://backend:4000;
    set $marketing_upstream http://marketing:80;

    location /admin/v1/ {
        proxy_pass $backend_upstream/admin/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1/ {
        proxy_pass $backend_upstream/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass $backend_upstream/health;
    }

    # Role training guides. Served same-origin so the portal's "Training guide"
    # menu item can use a relative /training/<role>.html link. The content lives
    # in the marketing container (marketing/training/); locally `npm run build`
    # copies it into dist/training/ instead (scripts/sync-training.mjs).
    location /training/ {
        proxy_pass $marketing_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
