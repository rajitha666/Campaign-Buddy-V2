# Static marketing site: serves ./marketing with clean URLs.
#   /                -> /landing-site/   (302)
#   /training/       -> marketing/training/index.html
#   /capability-brief.html (and any other root file) served as-is
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = / { return 302 /landing-site/; }
    location = /landing-site { return 301 /landing-site/; }
    location = /training { return 301 /training/; }
    location = /downloads { return 301 /downloads/; }

    # Directory indexing stays off (no autoindex directive) so /downloads/apk/
    # cannot be listed; releases are exposed only via /downloads/.
    location /landing-site/ { try_files $uri $uri/ =404; }
    location /training/     { try_files $uri $uri/ =404; }
    location /downloads/    { try_files $uri $uri/ =404; }

    location / { try_files $uri =404; }
}
