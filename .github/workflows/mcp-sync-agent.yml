name: MCP Sync Agent

# Keeps campaign-buddy-mcp/ in step with backend changes. Opens a PR; never pushes to main.
# Design + agent instructions: docs/mcp-sync-agent.md
#
# Trigger note: `push` is NOT a supported event for anthropics/claude-code-action
# (it only accepts workflow_dispatch, repository_dispatch, schedule, workflow_run,
# plus the issue/PR entity events) — an earlier version of this workflow used
# `on: push` and failed outright on every run ("Unsupported event type: push"),
# before it ever reached the agent step. We instead react to the existing CI
# workflow finishing on main, which both is supported and means we only review
# commits CI has actually validated.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      since:
        description: 'Review backend commits since this git ref (default: auto-detected from the previous CI run on main)'
        type: string
        default: ''
      dry_run:
        description: 'Dry run (plan only — no branch, no push, no PR)'
        type: boolean
        default: true

# One review at a time, queued not cancelled, so no backend commit is skipped.
concurrency:
  group: mcp-sync-agent
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: read # to look up the previous successful CI run's commit, below
  id-token: write

jobs:
  sync:
    name: Review backend changes for MCP impact
    # CI runs on both push-to-main and pull_request; only react to the former, on main,
    # and only once it succeeded. workflow_dispatch always runs (manual/dry-run use).
    # The agent's own PRs only touch campaign-buddy-mcp/ and never push to main, so this
    # also can't self-trigger a loop.
    if: >
      github.actor != 'github-actions[bot]' && github.actor != 'claude[bot]' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run checks out the default branch by default, not the commit that
          # triggered it — pin explicitly. Falls back to the normal ref on workflow_dispatch.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: campaign-buddy-mcp/package-lock.json

      - name: Install MCP package
        run: npm ci
        working-directory: campaign-buddy-mcp

      - name: Work out what to review
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SINCE: ${{ inputs.since }}
          CURRENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ -n "$INPUT_SINCE" ]; then
            SINCE="$INPUT_SINCE"
          elif [ -n "$CURRENT_RUN_ID" ]; then
            # The commit of the previous successful push-triggered CI run on main, i.e.
            # the last point this agent (or its predecessor logic) would have reviewed up to.
            SINCE=$(gh run list --workflow ci.yml --branch main --event push --status success \
                       --json databaseId,headSha --limit 20 \
                     | node -e '
                         const runs = JSON.parse(require("fs").readFileSync(0, "utf8"));
                         const cur = Number(process.env.CURRENT_RUN_ID);
                         const prev = runs.filter((r) => r.databaseId < cur).sort((a, b) => b.databaseId - a.databaseId)[0];
                         process.stdout.write(prev ? prev.headSha : "");
                       ')
          fi
          if [ -z "$SINCE" ]; then SINCE="HEAD~1"; fi
          if ! git cat-file -e "$SINCE" 2>/dev/null; then
            echo "::warning::Could not resolve '$SINCE' as a commit; falling back to HEAD~1."
            SINCE="HEAD~1"
          fi
          echo "since=$SINCE" >> "$GITHUB_OUTPUT"
          npm --prefix campaign-buddy-mcp run --silent sync-report -- --since "$SINCE" > campaign-buddy-mcp/.sync-report.json
          cat campaign-buddy-mcp/.sync-report.json
          CHANGED=$(node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));console.log(r.changedBackendFiles.length + r.drift)' campaign-buddy-mcp/.sync-report.json)
          if [ "$CHANGED" -gt 0 ]; then echo "work=true" >> "$GITHUB_OUTPUT"; else echo "work=false" >> "$GITHUB_OUTPUT"; fi

      - name: Nothing to review
        if: steps.scope.outputs.work != 'true'
        run: echo "No backend API-surface changes since ${{ steps.scope.outputs.since }} — nothing for the MCP to do." >> "$GITHUB_STEP_SUMMARY"

      - name: Choose agent tools
        id: tools
        env:
          DRY: ${{ inputs.dry_run == true && 'true' || 'false' }}
        run: |
          READ='Read,Glob,Grep,Edit,Write,Bash(npm --prefix campaign-buddy-mcp:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git status:*),Bash(git rev-parse:*)'
          WRITE='Bash(git checkout -b:*),Bash(git add:*),Bash(git commit:*),Bash(git push origin mcp-sync/*),Bash(gh pr create:*),Bash(gh pr list:*)'
          # A dry run gets no way to push or open a PR at all.
          if [ "$DRY" = "true" ]; then echo "allowed=$READ" >> "$GITHUB_OUTPUT"; else echo "allowed=$READ,$WRITE" >> "$GITHUB_OUTPUT"; fi

      - name: Check credential is configured
        if: steps.scope.outputs.work == 'true'
        env:
          HAS_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "$HAS_OAUTH" != "true" ] && [ "$HAS_KEY" != "true" ]; then
            echo "::error::No credential configured. Add repo secret CLAUDE_CODE_OAUTH_TOKEN (claude setup-token) or ANTHROPIC_API_KEY - see docs/mcp-sync-agent.md."
            exit 1
          fi

      - name: MCP sync agent
        if: steps.scope.outputs.work == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          # Set ONE of these two repo secrets; the unset one is ignored.
          #  - CLAUDE_CODE_OAUTH_TOKEN: from `claude setup-token` (Pro/Max subscription)
          #  - ANTHROPIC_API_KEY: pay-per-token Console key
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are the MCP sync agent. Read docs/mcp-sync-agent.md (section "Agent instructions") and follow it exactly.
            RANGE=${{ steps.scope.outputs.since }}..HEAD
            DRY_RUN=${{ inputs.dry_run == true && 'true' || 'false' }}
            The drift report from `npm run sync-report` is in campaign-buddy-mcp/.sync-report.json (untracked; do not commit it).
            Write your summary to the job summary file ($GITHUB_STEP_SUMMARY) as well as replying.
          claude_args: |
            --model claude-opus-5
            --max-turns 60
            --allowedTools "${{ steps.tools.outputs.allowed }}"
